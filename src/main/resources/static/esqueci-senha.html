<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acadêmico | Recuperar senha</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<main class="login-container">
    <section class="login-card">
        <div class="login-header">
            <h1>Recuperar senha</h1>
            <p>Informe seu e-mail institucional para receber o link de redefinição.</p>
        </div>
        <form id="recuperarForm">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            </div>
            <p id="mensagem" class="mensagem-erro"></p>
            <button type="submit" id="botaoEnviar">Enviar link</button>
        </form>
        <a class="link-secundario" href="/login.html">Voltar para o login</a>
    </section>
</main>
<script src="/js/esqueci-senha.js"></script>
</body>
</html>
